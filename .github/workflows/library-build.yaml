name: Library build

on:
  workflow_call:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v1.2.3"
        required: true
        type: string
      python-version:
        description: "Python version the tests run on before the build"
        required: false
        type: string
        default: "3.14"

permissions: {}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      # PyPI never accepts the same version twice, so a tag that disagrees
      # with pyproject.toml would publish under the wrong version for good.
      - name: Verify the tag matches the version
        env:
          TAG: ${{ inputs.tag }}
        shell: python
        run: |
          import os, sys, tomllib

          tag = os.environ["TAG"]
          with open("pyproject.toml", "rb") as f:
              version = "v" + tomllib.load(f)["project"]["version"]
          if tag != version:
              print(f"::error::tag {tag} does not match pyproject.toml version {version}")
              sys.exit(1)

  test:
    name: Test
    permissions:
      contents: read
    uses: ./.github/workflows/test.yaml
    with:
      ref: ${{ inputs.tag }}
      python-version: ${{ inputs.python-version }}

  build:
    name: Build
    needs: [version, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
