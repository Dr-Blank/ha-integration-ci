name: Test

on:
  workflow_call:
    inputs:
      ref:
        description: "Ref to check out; empty for the triggering ref"
        required: false
        type: string
        default: ""
      python-version:
        required: false
        type: string
        default: "3.14"

permissions:
  contents: read

jobs:
  prek:
    name: Prek
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Prek
        run: uv run prek run --all-files --hook-stage manual --show-diff-on-failure
