name: Validate

on:
  workflow_call:
    inputs:
      ref:
        description: "Ref to check out; empty for the triggering ref"
        required: false
        type: string
        default: ""
      hacs-ignore:
        description: "Space-separated HACS checks to skip, e.g. brands"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # No recent tags upstream, so Renovate cannot bump this; update by hand.
      - uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # No recent tags upstream, so Renovate cannot bump this; update by hand.
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          ignore: ${{ inputs.hacs-ignore }}
