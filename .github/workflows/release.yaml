name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v1.2.3"
        required: true
        type: string
      hacs-ignore:
        description: "Space-separated HACS checks to skip, e.g. brands"
        required: false
        type: string
        default: ""
      python-version:
        required: false
        type: string
        default: "3.14"

permissions: {}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      # Home Assistant reads the running version from the manifest, so a tag
      # that disagrees with it ships an integration that reports the wrong one.
      - name: Verify the tag matches both versions
        env:
          TAG: ${{ inputs.tag }}
        shell: python
        run: |
          import glob, json, os, sys, tomllib

          tag = os.environ["TAG"]
          manifests = glob.glob("custom_components/*/manifest.json")
          if len(manifests) != 1:
              print(f"::error::expected one custom_components/*/manifest.json, found {manifests}")
              sys.exit(1)
          with open("pyproject.toml", "rb") as f:
              project = "v" + tomllib.load(f)["project"]["version"]
          with open(manifests[0]) as f:
              manifest = "v" + json.load(f)["version"]
          failed = False
          for name, version in (("pyproject.toml", project), (manifests[0], manifest)):
              if tag != version:
                  print(f"::error::tag {tag} does not match {name} version {version}")
                  failed = True
          sys.exit(failed)

  test:
    name: Test
    permissions:
      contents: read
    uses: ./.github/workflows/test.yaml
    with:
      ref: ${{ inputs.tag }}
      python-version: ${{ inputs.python-version }}

  validate:
    name: Validate
    permissions:
      contents: read
    uses: ./.github/workflows/validate.yaml
    with:
      ref: ${{ inputs.tag }}
      hacs-ignore: ${{ inputs.hacs-ignore }}

  release:
    name: Release
    needs: [version, test, validate]
    permissions:
      contents: write
    # HACS installs from the tagged source when hacs.json sets zip_release to
    # false, so the release carries no build artifact.
    uses: ./.github/workflows/github-release.yaml
    with:
      tag: ${{ inputs.tag }}
