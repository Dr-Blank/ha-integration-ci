name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v1.2.3"
        required: true
        type: string
      hacs-ignore:
        description: "Space-separated HACS checks to skip, e.g. brands"
        required: false
        type: string
        default: ""
      python-version:
        required: false
        type: string
        default: "3.14"

permissions: {}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      # Home Assistant reads the running version from the manifest, so a tag
      # that disagrees with it ships an integration that reports the wrong one.
      - name: Verify the tag matches both versions
        env:
          TAG: ${{ inputs.tag }}
        shell: python
        run: |
          import glob, json, os, sys, tomllib

          tag = os.environ["TAG"]
          manifests = glob.glob("custom_components/*/manifest.json")
          if len(manifests) != 1:
              print(f"::error::expected one custom_components/*/manifest.json, found {manifests}")
              sys.exit(1)
          with open("pyproject.toml", "rb") as f:
              project = "v" + tomllib.load(f)["project"]["version"]
          with open(manifests[0]) as f:
              manifest = "v" + json.load(f)["version"]
          failed = False
          for name, version in (("pyproject.toml", project), (manifests[0], manifest)):
              if tag != version:
                  print(f"::error::tag {tag} does not match {name} version {version}")
                  failed = True
          sys.exit(failed)

  test:
    name: Test
    permissions:
      contents: read
    uses: ./.github/workflows/test.yaml
    with:
      ref: ${{ inputs.tag }}
      python-version: ${{ inputs.python-version }}

  validate:
    name: Validate
    permissions:
      contents: read
    uses: ./.github/workflows/validate.yaml
    with:
      ref: ${{ inputs.tag }}
      hacs-ignore: ${{ inputs.hacs-ignore }}

  release:
    name: Release
    needs: [version, test, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      # Groups the commits since the previous tag by Conventional Commits
      # type. gh release create prepends this to GitHub's generated notes.
      - name: Write the release notes
        env:
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if previous="$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null)"; then
            range="${previous}..${TAG}"
          else
            previous=""
            range="${TAG}"
          fi

          declare -A sections=()
          breaking=""

          while IFS=$'\t' read -r sha subject; do
            [ -n "$sha" ] || continue
            short="${sha:0:7}"
            if [[ "$subject" =~ ^([a-z]+)(\(([^\)]+)\))?(!)?:[[:space:]]+(.+)$ ]]; then
              type="${BASH_REMATCH[1]}"
              scope="${BASH_REMATCH[3]}"
              bang="${BASH_REMATCH[4]}"
              description="${BASH_REMATCH[5]}"
            else
              type="other"
              scope=""
              bang=""
              description="$subject"
            fi

            # The version bump commit carries no change of its own.
            if [ "$type" = "chore" ] && [ "$scope" = "release" ]; then
              continue
            fi

            line="- ${scope:+**${scope}:** }${description} (${short})"
            if [ -n "$bang" ] || grep -q '^BREAKING[ -]CHANGE:' <<<"$(git log -1 --format=%B "$sha")"; then
              breaking+="${line}"$'\n'
              continue
            fi

            case "$type" in
              feat) key="feat" ;;
              fix) key="fix" ;;
              perf) key="perf" ;;
              refactor) key="refactor" ;;
              docs) key="docs" ;;
              build | ci | chore | style | test) key="maintenance" ;;
              *) key="other" ;;
            esac
            sections[$key]+="${line}"$'\n'
          done < <(git log --no-merges --format='%H%x09%s' "$range")

          print_section() {
            local title="$1" body="$2"
            if [ -n "$body" ]; then
              printf '### %s\n\n%s\n' "$title" "$body"
            fi
          }

          {
            if [ -n "$previous" ]; then
              printf '## Commits since %s\n\n' "$previous"
            else
              printf '## Commits\n\n'
            fi
            if [ ${#sections[@]} -eq 0 ] && [ -z "$breaking" ]; then
              printf 'No changes besides the version bump.\n'
            fi
            print_section "Breaking changes" "$breaking"
            print_section "Features" "${sections[feat]:-}"
            print_section "Fixes" "${sections[fix]:-}"
            print_section "Performance" "${sections[perf]:-}"
            print_section "Refactoring" "${sections[refactor]:-}"
            print_section "Documentation" "${sections[docs]:-}"
            print_section "Maintenance" "${sections[maintenance]:-}"
            print_section "Other changes" "${sections[other]:-}"
          } > "$RUNNER_TEMP/notes.md"

      # HACS installs from the tagged source when hacs.json sets zip_release
      # to false, so the release carries no build artifact.
      - name: Create the GitHub release if it is missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists, skipping"
            exit 0
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            --verify-tag
